<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <!-- logo will go here -->
    </header>
    
    <!-- Navigation Bar -->
    <div id="nav-bar">
        <nav>
            <ul>
                <li><a href="home.html" class="nav-button">Home</a></li>
                <li><a href="contact.html" class="nav-button">Contact</a></li>
                <li><a href="product-listing.html" class="nav-button">Products</a></li>
                <li><form><input type="text" name="search-bar" id="search-bar" placeholder="&#128270;"></form></li>
                <li><a href="cart.html"><img src="images/cart.svg" alt="Shopping Cart"></a></li>
                <li><a href="login.html"><img src="images/person-circle.svg" alt="Login"></a></li>
            </ul>
        </nav>
        <hr>
    </div>

    <div id="cart-page-content">

        <table>
            <tr>
                <th>
                    <img src="https://image.hm.com/assets/hm/2c/74/2c7463c83fd3839350dabfb085c4963dc6a363ce.jpg?imwidth=1260" alt="Featured Item 1" height="220" width="145" class="featured-items">
                </th>
                <th>
                    <div class="cart-description">
                        <p>Featured Item 1</p>
                        <p>Colour</p>
                        <p>Size</p>
                        <p>Price</p>
                    </div>
                </th>
                <th>
                    <div class="cart-quantity">
                        <button class="remove-button">
                            <img src="images/trash.svg" alt="">
                        </button>
                        <input class="quantity" type="text" value="1" size="1">
                        <button class="add-button">
                            <img src="images/plus.svg" alt="">
                        </button>
                    </div>
                </th>
            </tr>
            <tr>
                <th>
                    <img src="https://image.hm.com/assets/hm/9b/70/9b70f3d0d0c3260c648c33a3b660f1c2179aaf10.jpg?imwidth=1260" alt="Featured Item 2" height="220" width="145" class="featured-items">
                </th>
                <th class="cart-description">
                    <p>Featured Item 2</p>
                    <p>Colour</p>
                    <p>Size</p>
                    <p>Price</p>
                </th>
                <th>
                    <div class="cart-quantity">
                        <button class="remove-button">
                            <img src="images/trash.svg" alt="">
                        </button>
                        <input class="quantity" type="text" value="1" size="1">
                        <button class="add-button">
                            <img src="images/plus.svg" alt="">
                        </button>
                    </div>
                </th>
            </tr>
        </table>

        <br>

        <table id="order-summary">
            <tr>
                <th class="amount-descr"><h2>Order Summary</h2></th>
                <th class="amount"></th>
            </tr>
            <tr>
                <th class="amount-descr">Subtotal</th>
                <th class="amount">$0.00</th>
            </tr>
            <tr>
                <th class="amount-descr">Shipping</th>
                <th class="amount">Free</th>
            </tr>
            <tr>
                <th class="amount-descr">Tax</th>
                <th class="amount">$0.00</th>
            </tr>
            <tr>
                <th class="amount-descr">Total</th>
                <th class="amount">0.00</th>
            </tr>
            <tr>
                <th><br></th>
                <th><br></th>
            </tr>
            <tr>
                <th></th>
                <th>
                    <a href="order-confirmation.html"><button>Place Order</button></a>
                </th>
            </tr>
        </table>

    </div>

    <!-- Footer with links -->
    <footer>
        <hr>
        <br>
        <table>
            <tr>
                <th><a href="product-listing.html" class="footer-item">Products</a></th>
                <th><a href="contact.html" class="footer-item">Contact</a></th>
                <th><a href="login.html" class="footer-item">Create an Account</a></th>
            </tr>
            <tr>
                <th class="footer-item"><a href="cart.html">Cart</a></th>
                <th class="footer-item"><a href="home.html">About Us</a></th>
                <th class="footer-item"><a href="login.html">Login</a></th>
