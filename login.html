<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <!-- logo will go here -->
    </header>
    
    <!-- Navigation Bar -->
    <div id="nav-bar">
        <nav>
            <ul>
                <li><a href="home.html" class="nav-button">Home</a></li>
                <li><a href="contact.html" class="nav-button">Contact</a></li>
                <li><a href="product-listing.html" class="nav-button">Products</a></li>
                <li><form><input type="text" name="search-bar" id="search-bar" placeholder="&#128270;"></form></li>
                <li><a href="cart.html"><img src="images/cart.svg" alt="Shopping Cart"></a></li>
                <li><a href="login.html"><img src="images/person-circle.svg" alt="Login"></a></li>
            </ul>
        </nav>
        <hr>
    </div>

    <div id="create-account-login">
        <!-- Create an account section -->
        <div class="login">
            <h3>Create Account</h3>
            <hr>
            <form action="server-endpoint" method="POST">
                <table>
                    <tr>
                        <th class="login-label">
                            <label for="username">Username</label>
                        </th>
                        <th>
                            <input type="text" name="username" id="username" required>
                        </th>
                    </tr>
                    <tr>
                        <th class="login-label">
                            <label for="first-name">First Name</label>
                        </th>
                        <th>
                            <input type="text" name="first-name" id="first-name">
                        </th>
                    </tr>
                    <tr>
                        <th class="login-label">
                            <label for="last-name">Last Name</label>                            
                        </th>
                        <th>
                            <input type="text" name="last-name" id="last-name">
                        </th>
                    </tr>
                    <tr>
                        <th class="login-label">
                            <label for="birthday">Birthday</label>
                        </th>
                        <th>
                            <input type="date" name="birthday" id="birthday">
                        </th>
                    </tr>
                    <tr>
                        <th class="login-label">
                            <label for="password">Password</label>
                        </th>
                        <th>
                            <input type="password" name="password" id="password">
                        </th>
                    </tr>
                    <tr>
                        <th class="login-label">
                            <label for="confirm-password">Confirm Password</label>
                        </th>
                        <th>
                            <input type="password" name="confirm-password" id="confirm-password">
                        </th>
                    </tr>
                    <tr>
                        <th colspan="2" class="sign-up-button">
                            <input type="button" value="Sign Up">
                        </th>
                    </tr>
                </table>
            </form>
        </div>
        <!-- Login section -->
        <div class="login">
            <h3>Login</h3>
            <hr>
            <form action="server-endpoint" method="POST">
                <table>
                    <tr>
                        <th class="login-label">
                            <label for="username">Username</label>
                        </th>
                        <th>
                            <input type="text" name="username" id="username">
                        </th>
                    </tr>
                    <tr>
                        <th id="login-label">
                            <label for="password">Password</label>
                        </th>
                        <th>
                            <input type="password" name="password" id="password">
                        </th>
                    </tr>
                    <tr>
                        <th colspan="2" class="sign-up-button">
                            <input type="button" value="Login">
                        </th>
                    </tr>
                </table>
            </form>
        </div>
    </div>

    <!-- Footer with links -->
    <footer>
        <hr>
        <br>
        <table>
            <tr>
                <th><a href="product-listing.html" class="footer-item">Products</a></th>
                <th><a href="contact.html" class="footer-item">Contact</a></th>
                <th><a href="login.html" class="footer-item">Create an Account</a></th>
            </tr>
            <tr>
                <th class="footer-item"><a href="cart.html">Cart</a></th>
                <th class="footer-item"><a href="home.html">About Us</a></th>
                <th class="footer-item"><a href="login.html">Login</a></th>
            </tr>
        </table>
    </footer>
</body>
</html>
