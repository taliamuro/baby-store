    <div id="create-account-login" class="page-content">
        <!-- Create an account section -->
        <div class="login" id="validation-alert-messages">
            <h3>Create Account</h3>
            <hr>
            <form action="server-endpoint" method="POST" id="form-validation">
                <table>
                    <tr>
                        <td class="login-label">
                            <label for="create-username">Username</label>
                        </td>
                        <td>
                            <input type="text" name="username" id="create-username" required>
                        </td>
                    </tr>
                    <tr>
                        <td class="login-label">
                            <label for="first-name">First Name</label>
                        </td>
                        <td>
                            <input type="text" name="first-name" id="first-name">
                        </td>
                    </tr>
                    <tr>
                        <td class="login-label">
                            <label for="last-name">Last Name</label>                            
                        </td>
                        <td>
                            <input type="text" name="last-name" id="last-name">
                        </td>
                    </tr>
                    <tr>
                        <td class="login-label">
                            <label for="birthday">Birthday</label>
                        </td>
                        <td>
                            <input type="date" name="birthday" id="birthday">
                        </td>
                    </tr>
                    <tr>
                        <td class="login-label">
                            <label for="create-password">Password</label>
                        </td>
                        <td>
                            <input type="password" name="password" id="create-password">
                        </td>
                    </tr>
                    <tr>
                        <td class="login-label">
                            <label for="confirm-password">Confirm Password</label>
                        </td>
                        <td>
                            <input type="password" name="confirm-password" id="confirm-password">
                        </td>
                    </tr>
                    <tr>
                        <td colspan="2" class="sign-up-button">
                            <input type="button" value="Sign Up" id="sign-up-btn">
                        </td>
                    </tr>
                </table>
            </form>
        </div>
        <!-- Login section -->
        <div class="login">
            <h3>Login</h3>
            <hr>
            <form action="server-endpoint" method="POST">
                <table>
                    <tr>
                        <td class="login-label">
                            <label for="login-username">Username</label>
                        </td>
                        <td>
                            <input type="text" name="username" id="login-username">
                        </td>
                    </tr>
                    <tr>
                        <td class="login-label">
                            <label for="login-password">Password</label>
                        </td>
                        <td>
                            <input type="password" name="password" id="login-password">
                        </td>
                    </tr>
                    <tr>
                        <td colspan="2" class="sign-up-button">
                            <input type="button" value="Login" id="login-btn">
                        </td>
                    </tr>
                </table>
            </form>
        </div>
