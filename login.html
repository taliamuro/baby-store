<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>

    <header>
        <!-- logo will go here -->
    </header>
    
    <!-- Navigation Bar -->
    <div id="nav-bar">
        <nav id="nav">
            <ul>
                <li><a href="home.html" class="nav-button">Home</a></li>
                <li><a href="contact.html" class="nav-button">Contact</a></li>
                <li><a href="product-listing.html" class="nav-button">Products</a></li>
                <li><form><input type="search" name="search-bar" id="search-bar" placeholder="&#128270;"></form></li>
                <li><a href="cart.html"><img src="images/cart.svg" alt="Shopping Cart"></a></li>
                <li><a href="login.html"><img src="images/person-circle.svg" alt="Login"></a></li>
            </ul>
        </nav>
    </div>

    <div id="create-account-login" class="page-content">
        <!-- Create an account section -->
        <div class="login">
            <h3>Create Account</h3>
            <hr>
            <form action="server-endpoint" method="POST">
                <table>
                    <tr>
                        <td class="login-label">
                            <label for="username">Username</label>
                        </td>
                        <td>
                            <input type="text" name="username" id="username" required>
                        </td>
                    </tr>
                    <tr>
                        <td class="login-label">
                            <label for="first-name">First Name</label>
                        </td>
                        <td>
                            <input type="text" name="first-name" id="first-name">
                        </td>
                    </tr>
                    <tr>
                        <td class="login-label">
                            <label for="last-name">Last Name</label>                            
                        </td>
                        <td>
                            <input type="text" name="last-name" id="last-name">
                        </td>
                    </tr>
                    <tr>
                        <td class="login-label">
                            <label for="birtdday">Birthday</label>
                        </td>
                        <td>
                            <input type="date" name="birthday" id="birthday">
                        </td>
                    </tr>
                    <tr>
                        <td class="login-label">
                            <label for="password">Password</label>
                        </td>
                        <td>
                            <input type="password" name="password" id="password">
                        </td>
                    </tr>
                    <tr>
                        <td class="login-label">
                            <label for="confirm-password">Confirm Password</label>
                        </td>
                        <td>
                            <input type="password" name="confirm-password" id="confirm-password">
                        </td>
                    </tr>
                    <tr>
                        <td colspan="2" class="sign-up-button">
                            <input type="button" value="Sign Up">
                        </td>
                    </tr>
                </table>
            </form>
        </div>
        <!-- Login section -->
        <div class="login">
            <h3>Login</h3>
            <hr>
            <form action="server-endpoint" method="POST">
                <table>
                    <tr>
                        <td class="login-label">
                            <label for="username">Username</label>
                        </td>
                        <td>
                            <input type="text" name="username" id="username">
                        </td>
                    </tr>
                    <tr>
                        <td id="login-label">
                            <label for="password">Password</label>
                        </td>
                        <td>
                            <input type="password" name="password" id="password">
                        </td>
                    </tr>
                    <tr>
                        <td colspan="2" class="sign-up-button">
                            <input type="button" value="Login">
                        </td>
                    </tr>
                </table>
            </form>
        </div>
    </div>

            </tr>
            <tr>
                <td class="footer-item"><a href="cart.html">Cart</a></td>
                <td class="footer-item"><a href="home.html">About Us</a></td>
                <td class="footer-item"><a href="login.html">Login</a></td>
            </tr>
        </table>
    </footer>
</body>
</html>
