    <link rel="preconnect" href="https://fonts.googleapis.com">

     <style>
        #leaflet-map {

        }

  <body>
    <h1>Leaflet Map!</h1>

    <div class="container">
        <div class="row">
            <!-- first column where the list of places will be rendered -->
            <div class="col-2">

            <!-- second column where the map will be rendered -->
            <div class="col-10" id="leaflet-map"> <!-- total 12 cols-->

            </div>
        </div>

    </div>

    <script type="module" src="js/app.js" defer></script>
